version: 2

updates:
  # Keeps the pinned action majors current; without this they silently rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'
    # Dev-only toolchain: group the updates so they arrive as one reviewable PR.
    groups:
      dev-tooling:
        patterns:
          - '*'
