name: Coding Standards

# Wp-Insert is pure PHP — there is no package.json, so unlike the sibling block
# plugins this workflow has no JavaScript/CSS lint job. It gains a PHP syntax
# matrix instead, because the plugin supports PHP 7.4 through current.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpcs:
    name: PHP Coding Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      # lint:release disables the phpcs result cache. A cached run can report a
      # clean tree while new violations sit unreported, which has happened here.
      - name: Run PHPCS
        run: composer lint:release

  php-syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (Requires PHP: 7.4) through current stable.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every shipped PHP file
        run: |
          # Only the files that ship: vendor/ and build output are excluded.
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './build/*' \
            -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "All PHP files parse on PHP ${{ matrix.php }}."
